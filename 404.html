<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVA FIT | Erro 404</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/404.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
</head>
<body>
    <div class="acessibilidade-container acess-fixed">
        <button id="btnAcess" class="btn-acess" aria-label="Acessibilidade">
            <i class="fa-solid fa-gear"></i>
        </button>
        <div id="menuAcess" class="menu-acess">
            <span>Acessibilidade</span>
            <div class="acoes-acess">
                <button id="btnAumentar" title="Aumentar Fonte">A+</button>
                <button id="btnDiminuir" title="Diminuir Fonte">A-</button>
                <button id="btnContraste" title="Tema claro / escuro" aria-label="Alternar tema claro e escuro"><i class="fa-solid fa-circle-half-stroke"></i></button>
            </div>
        </div>
    </div>

    <main class="pagina-erro">
        <section class="conteudo-erro">

            <img class="logo-movafit" src="assets/imagens/logo-movafit.png" alt="MOVA FIT">

            <div class="numero-erro" id="numeroErro">404</div>

            <h1 id="tituloErro"><span>Ops!</span> Página não encontrada</h1>

            <p class="mensagem-erro" id="textoErro">
                A página que você está procurando não existe, foi removida ou o endereço foi digitado incorretamente.
            </p>

            <div class="botoes-erro">
                <a class="botao-inicio" id="botaoErro" href="index.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Voltar ao início</span>
                </a>

                <a class="botao-secundario" id="botaoCadastro" href="cadastro.html" hidden>
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Quero me cadastrar</span>
                </a>
            </div>

        </section>
    </main>
    <script src="js/acessibilidade.js"></script>
<script src="js/404.js"></script>
</body>
</html>
