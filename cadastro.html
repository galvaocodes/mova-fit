<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | MOVA FIT</title>
    <!-- CSS DO CADASTRO -->
    <link rel="stylesheet" href="css/cadastro.css">
    <!-- ÍCONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
<div class="acessibilidade-container acess-fixed">
        <button id="btnAcess" class="btn-acess" aria-label="Acessibilidade">
            <i class="fa-solid fa-gear"></i>
        </button>
        <div id="menuAcess" class="menu-acess">
            <span>Acessibilidade</span>
            <div class="acoes-acess">
                <button id="btnAumentar" title="Aumentar Fonte">A+</button>
                <button id="btnDiminuir" title="Diminuir Fonte">A-</button>
                <button id="btnContraste" title="Alto Contraste"><i class="fa-solid fa-circle-half-stroke"></i></button>
            </div>
        </div>
    </div>
    <main class="auth-container">
        <div class="auth-card">
            
            <div class="auth-header">
                <a href="index.html" class="logo-link" aria-label="Voltar para a página inicial">
                    <img src="assets/imagens/logo-movafit.png" alt="MOVA FIT" class="logo-img">
                </a>
                <h1>Crie sua conta</h1>
                <p>Preencha os campos abaixo para fazer parte da MOVA FIT.</p>
            </div>

            <!-- MENSAGEM DE FEEDBACK VISUAL (SEM ALERT) -->
            <div id="feedbackMensagem" class="feedback-mensagem" aria-live="polite"></div>

            <form id="formCadastro" novalidate>

                <!-- DADOS PESSOAIS -->
                <fieldset class="form-grupo-fieldset">
                    <legend><i class="fa-solid fa-user"></i> Dados Pessoais</legend>

                    <div class="input-grupo">
                        <label for="nome">Nome Completo (15 a 80 letras)</label>
                        <input type="text" id="nome" name="nome" placeholder="Ex: Ana Luiza Souza" required>
                        <span class="erro-texto" id-erro="nome"></span>
                    </div>

                    <div class="input-linha">
                        <div class="input-grupo">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                            <span class="erro-texto" id-erro="cpf"></span>
                        </div>

                        <div class="input-grupo">
                            <label for="dataNascimento">Data de Nascimento</label>
                            <input type="date" id="dataNascimento" name="dataNascimento" required>
                            <span class="erro-texto" id-erro="dataNascimento"></span>
                        </div>
                    </div>

                    <div class="input-linha">
                        <div class="input-grupo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                            <span class="erro-texto" id-erro="email"></span>
                        </div>

                        <div class="input-grupo">
                            <label for="telefone">Celular (+55)XX-XXXXXXXX</label>
                            <input type="text" id="telefone" name="telefone" placeholder="(+55)21-99999999" required>
                            <span class="erro-texto" id-erro="telefone"></span>
                        </div>
                    </div>
                </fieldset>

                <!-- ENDEREÇO (VIACEP) -->
                <fieldset class="form-grupo-fieldset">
                    <legend><i class="fa-solid fa-location-dot"></i> Endereço</legend>

                    <div class="input-linha">
                        <div class="input-grupo">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
                            <span class="erro-texto" id-erro="cep"></span>
                        </div>

                        <div class="input-grupo">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Preenchimento automático" required>
                            <span class="erro-texto" id-erro="cidade"></span>
                        </div>
                    </div>

                    <div class="input-linha">
                        <div class="input-grupo">
                            <label for="rua">Rua / Logradouro</label>
                            <input type="text" id="rua" name="rua" placeholder="Preenchimento automático" required>
                            <span class="erro-texto" id-erro="rua"></span>
                        </div>

                        <div class="input-grupo">
                            <label for="uf">Estado (UF)</label>
                            <input type="text" id="uf" name="uf" placeholder="UF" maxlength="2" required>
                            <span class="erro-texto" id-erro="uf"></span>
                        </div>
                    </div>
                </fieldset>

                <!-- INFORMAÇÕES ADICIONAIS -->
                <fieldset class="form-grupo-fieldset">
                    <legend><i class="fa-solid fa-file-lines"></i> Informações Adicionais</legend>

                    <div class="input-linha">
                        <div class="input-grupo">
                            <label for="nacionalidade">Nacionalidade</label>
                            <input type="text" id="nacionalidade" name="nacionalidade" placeholder="Ex: Brasileira" required>
                        </div>

                        <div class="input-grupo">
                            <label for="estadoCivil">Estado Civil</label>
                            <select id="estadoCivil" name="estadoCivil" required>
                                <option value="">Selecione...</option>
                                <option value="Solteiro(a)">Solteiro(a)</option>
                                <option value="Casado(a)">Casado(a)</option>
                                <option value="Divorciado(a)">Divorciado(a)</option>
                                <option value="Viúvo(a)">Viúvo(a)</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-grupo">
                        <label for="escolaridade">Escolaridade</label>
                        <select id="escolaridade" name="escolaridade" required>
                            <option value="">Selecione...</option>
                            <option value="Ensino Médio Completo">Ensino Médio Completo</option>
                            <option value="Ensino Superior Cursando">Ensino Superior Cursando</option>
                            <option value="Ensino Superior Completo">Ensino Superior Completo</option>
                            <option value="Pós-graduação">Pós-graduação</option>
                        </select>
                    </div>
                </fieldset>

                <!-- CREDENCIAIS DE ACESSO -->
                <!-- CREDENCIAIS DE ACESSO -->
<fieldset class="form-grupo-fieldset">
    <legend><i class="fa-solid fa-lock"></i> Credenciais de Acesso</legend>

    <div class="input-grupo">
       <label for="login">
        Login 
         <span class="tooltip-custom">
             <i class="fa-solid fa-circle-info"></i>
        <span class="tooltip-texto">Exatamente 6 caracteres alfabéticos</span>
         </span>
        </label>
        <input type="text" id="login" name="login" placeholder="Ex: movafit" maxlength="6" required>
        <span class="erro-texto" id-erro="login"></span>
    </div>

    <!-- O .input-linha já deixa lado a lado! -->
    <div class="input-linha">
        <div class="input-grupo">
           <label for="senha">
                Senha 
                 <span class="tooltip-custom">
                     <i class="fa-solid fa-circle-info"></i>
                     <span class="tooltip-texto">Exatamente 8 caracteres alfabéticos</span>
                 </span>
            </label>
            <!-- Container novo para a senha e o olhinho -->
            <div class="input-container">
                <input type="password" id="senha" name="senha" placeholder="Ex: abcdwxyz" maxlength="8" required>
                <button type="button" class="btn-olho" onclick="toggleSenha('senha', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            <span class="erro-texto" id-erro="senha"></span>
        </div>

        <div class="input-grupo">
            <label for="confirmaSenha">Confirme a Senha</label>
            <div class="input-container">
                <input type="password" id="confirmaSenha" name="confirmaSenha" placeholder="Repita a senha" maxlength="8" required>
                <button type="button" class="btn-olho" onclick="toggleSenha('confirmaSenha', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            <span class="erro-texto" id-erro="confirmaSenha"></span>
        </div>
    </div>
</fieldset>

                <button type="submit" class="btn-principal btn-submit">
                    Concluir Cadastro <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="auth-footer">
                <p>Já possui uma conta? <a href="login.html">Faça login aqui</a></p>
            </div>

        </div>
    </main>

    <!-- JAVASCRIPT DO CADASTRO -->
    <script src="js/cadastro.js"></script>
</body>

</html>
