<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | MOVA FIT</title>

    <!-- Fonte Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Puxa as variáveis e o cabeçalho do Dashboard, e o visual do Feedback -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/feedback.css">
</head>
<body>

    <!-- CABEÇALHO LIMPO (Sem Engrenagem) -->
    <!-- CABEÇALHO CORRIGIDO E ALINHADO -->
    <header class="cabecalho">
        
        <!-- LOGO NA ESQUERDA -->
        <a href="dashboard.html" class="logo-btn" aria-label="Ir para o início">
            <img src="assets/imagens/logo-movafit.png" alt="MOVA FIT" class="logo-img">
        </a>

        <!-- ESPAÇO VAZIO PARA EMPURRAR O RESTO PARA A DIREITA -->
        <div style="flex: 1;"></div>

        <!-- LADO DIREITO (USUÁRIO E BOTÃO VOLTAR) -->
        <div class="header-direita">
            
            <div class="usuario-logado">
                <i class="fa-solid fa-circle-user"></i>
                <span>Olá, <strong id="nomeUsuario">Usuário</strong></span>
                <div class="acessibilidade-container">
                <button id="btnAcess" class="btn-acess" aria-label="Acessibilidade">
                 <i class="fa-solid fa-gear"></i>
                </button>
           <div id="menuAcess" class="menu-acess">
              <span>Acessibilidade</span>
           <div class="acoes-acess">
                <button id="btnAumentar" title="Aumentar Fonte">A+</button>
                <button id="btnDiminuir" title="Diminuir Fonte">A-</button>
                <button id="btnContraste" title="Alto Contraste"><i class="fa-solid fa-circle-half-stroke"></i></button>
            </div>
        </div>
    </div>
            </div>

            <a href="dashboard.html" class="btn-sair" style="text-decoration: none;" aria-label="Voltar para o Dashboard">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Voltar</span>
            </a>
            
        </div>
        
    </header>

    <main class="dashboard">
        <section class="feedback-area container">
            
            <!-- FORMULÁRIO -->
            <div class="feedback-card">
                <div class="feedback-card-cabecalho">
                    <h2>Enviar feedback</h2>
                    <p>Sua opinião nos ajuda a melhorar cada movimento.</p>
                </div>

                <!-- ALERTA DE ERRO VISUAL (Cumpre a exigência do PDF de não usar alert) -->
                <div id="mensagem-erro" class="mensagem-erro" hidden>
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Preencha os campos obrigatórios antes de enviar.</span>
                </div>

                <form id="form-feedback" novalidate>
                    
                    <!-- 1. SELECT -->
                    <div class="campo-feedback">
                        <label for="categoria">Sobre o que você quer falar? <span class="obrigatorio">*</span></label>
                        <select id="categoria" name="categoria" required>
                            <option value="" selected disabled>Selecione uma categoria</option>
                            <option value="Academia">Academia</option>
                            <option value="Atendimento">Atendimento</option>
                            <option value="Equipamentos">Equipamentos</option>
                            <option value="Aulas">Aulas</option>
                            <option value="Aplicativo/Site">Aplicativo/Site</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>

                    <!-- 2. AVALIAÇÃO (ESTRELAS) -->
                    <div class="campo-feedback">
                        <label>Como você avalia sua experiência? <span class="obrigatorio">*</span></label>
                        <div class="estrelas" id="estrelas">
                            <button type="button" class="estrela" data-valor="1" aria-label="1 estrela"><i class="fa-regular fa-star"></i></button>
                            <button type="button" class="estrela" data-valor="2" aria-label="2 estrelas"><i class="fa-regular fa-star"></i></button>
                            <button type="button" class="estrela" data-valor="3" aria-label="3 estrelas"><i class="fa-regular fa-star"></i></button>
                            <button type="button" class="estrela" data-valor="4" aria-label="4 estrelas"><i class="fa-regular fa-star"></i></button>
                            <button type="button" class="estrela" data-valor="5" aria-label="5 estrelas"><i class="fa-regular fa-star"></i></button>
                        </div>
                        <input type="hidden" id="avaliacao" name="avaliacao">
                    </div>

                    <!-- 3. RADIO BUTTONS -->
                    <div class="campo-feedback">
                        <label>Qual é o tipo do seu feedback? <span class="obrigatorio">*</span></label>
                        <div class="opcoes-radio">
                            <label><input type="radio" name="tipoFeedback" value="Sugestão" required> Sugestão</label>
                            <label><input type="radio" name="tipoFeedback" value="Elogio"> Elogio</label>
                            <label><input type="radio" name="tipoFeedback" value="Reclamação"> Reclamação</label>
                        </div>
                    </div>
                    
                    <!-- 4. RANGE DE SATISFAÇÃO -->
                    <div class="campo-feedback">
                        <label for="satisfacao">Qual seu nível de satisfação?</label>
                        <div class="range-area">
                            <input type="range" id="satisfacao" name="satisfacao" min="0" max="10" value="5">
                            <span id="valor-satisfacao" class="badge-range">5/10</span>
                        </div>
                    </div>

                    <!-- 5. TEXTO CURTO -->
                    <div class="campo-feedback">
                        <label for="assunto">Assunto <span class="obrigatorio">*</span></label>
                        <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto" maxlength="80" required>
                    </div>

                    <!-- 6. TEXTAREA -->
                    <div class="campo-feedback">
                        <div class="label-mensagem">
                            <label for="mensagem">Mensagem</label>
                            <span id="contador">0/500</span>
                        </div>
                        <textarea id="mensagem" name="mensagem" placeholder="Conte pra gente sua experiência..." maxlength="500" required></textarea>
                    </div>

                    <!-- 7. CHECKBOX -->
                    <label class="retorno-feedback">
                        <input type="checkbox" id="retorno" name="retorno">
                        <span>Quero receber um retorno sobre este feedback</span>
                    </label>

                    <!-- BOTÕES -->
                    <div class="acoes-feedback">
                        <a href="dashboard.html" class="btn-ghost">Cancelar</a>
                        <button type="submit" class="btn-primary">Enviar feedback</button>
                    </div>
                </form>
            </div>

            <!-- CARD LATERAL -->
            <aside class="feedback-info">
                <div class="feedback-info-icone"><i class="fa-regular fa-comments"></i></div>
                <h2>Estamos ouvindo você</h2>
                <p>Cada feedback ajuda a construir uma Mova Fit melhor para todos.</p>

                <div class="feedback-topicos">
                    <div class="feedback-topico"><i class="fa-regular fa-lightbulb"></i> <span>Sugestões</span></div>
                    <div class="feedback-topico"><i class="fa-regular fa-heart"></i> <span>Elogios</span></div>
                    <div class="feedback-topico"><i class="fa-regular fa-message"></i> <span>Experiências</span></div>
                </div>
            </aside>
        </section>
    </main>

    <script src="js/feedback.js"></script>
</body>
</html>
